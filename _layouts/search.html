{% include head.html %}
{% include nav.html %}

<div class="mk-band mk-band-dark mk-band-hero">
  <div class="mk-wrap mk-hero">
    <h1 class="mk-section-title">Search</h1>
    <form class="mk-search" action="/search.html" method="GET" role="search">
      <input type="search" name="query" id="search-box" placeholder="Search posts, e.g. cuda" aria-label="Search posts">
      <button type="submit">Search</button>
    </form>
  </div>
</div>

<main class="mk-main">
  <div id="search-results"></div>
</main>

<script>
  window.store = {
    {% for post in site.posts %}
      "{{ post.url | slugify }}": {
        "title": {{ post.title | jsonify }},
        "author": {{ post.author | jsonify }},
        "category": {{ post.categories | join: " " | jsonify }},
        "kind": {{ post.categories | first | jsonify }},
        "content": {{ post.content | strip_html | strip_newlines | jsonify }},
        "excerpt": {{ post.excerpt | strip_html | normalize_whitespace | truncate: 300 | jsonify }},
        "date": {{ post.date | date: "%-d %B %Y" | jsonify }},
        "banner": {{ post.banner | jsonify }},
        "url": {{ post.url | jsonify }}
      }
      {% unless forloop.last %},{% endunless %}
    {% endfor %}
  };
</script>
<script src="/js/lunr.min.js"></script>
<script src="/js/search.js"></script>

{% include footer.html %}
