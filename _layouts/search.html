{% include header.html %}

    <section id="blog-sec">
      <div class="container">
        <div class="row">

          <div class="col-12 col-md-12 col-lg-9">

			<div class="search-wraper wow fadeInUp" data-wow-delay="0.2s">
                <div class="search-form-wraper">
                  <form action="/search.html" method="GET">
                    <input type="text" name="query" id="search-box" placeholder="Search">
                    <button class="btn-bg"><img src="/images/icons/search.svg" alt="Search"></button>
                  </form>
                </div>
            </div>

			<br>
			<br>
			<div id="search-results"></div>


			<script>
			  window.store = {
			    {% for post in site.posts %}
			      "{{ post.url | slugify }}": {
			        "title": {{ post.title | jsonify }},
			        "author": {{ post.author | jsonify }},
			        "category": {{ post.categories | join: " " | jsonify }},
			        "content": {{ post.content | strip_html | strip_newlines | jsonify }},
			        "date": {{ post.date | date: "%-d %B %Y" | jsonify }},
			        "banner": {{ post.banner | jsonify }},
			        "url": {{ post.url | jsonify }}
			      }
			      {% unless forloop.last %},{% endunless %}
			    {% endfor %}
			  };
			</script>
			<script src="/js/lunr.min.js"></script>
			<script src="/js/search.js"></script>

          </div>


        </div>
      </div>
    </section>


{% include footer.html %}
